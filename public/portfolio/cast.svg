<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Inter', 'Helvetica Neue', sans-serif">
  <title>Cast — MCP analytics dashboard</title>
  <desc>Cast dashboard: total requests chart, top tools, and MCP server breakdown</desc>

  <defs>
    <linearGradient id="castArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="castBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="680" height="440" rx="10" fill="#0a0a0b"/>

  <!-- ===== Sidebar ===== -->
  <rect x="0" y="0" width="132" height="440" rx="10" fill="#101013"/>
  <rect x="118" y="0" width="14" height="440" fill="#101013"/>
  <!-- logo -->
  <rect x="16" y="18" width="22" height="22" rx="6" fill="#000"/>
  <path d="M 24.5 22.5 A 8 8 0 0 1 24.5 35.5" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 24.5 25.5 A 5 5 0 0 1 24.5 32.5" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="23" cy="29" r="1.6" fill="#3b82f6"/>
  <text x="46" y="28" fill="#e7e7ea" font-size="11" font-weight="700">Demo User</text>
  <text x="46" y="38" fill="#6b6b73" font-size="7.5">demo@cast.so</text>

  <text x="16" y="64" fill="#5a5a63" font-size="7" font-weight="700" letter-spacing="0.6">ACTIVE SERVERS</text>

  <!-- nav items -->
  <rect x="12" y="74" width="108" height="22" rx="6" fill="#1c1c22"/>
  <circle cx="24" cy="85" r="2.6" fill="#9aa0ff"/>
  <text x="34" y="88" fill="#e7e7ea" font-size="9" font-weight="600">Dashboard</text>
  <text x="34" y="112" fill="#8a8a93" font-size="9">MCP Servers</text>
  <text x="34" y="134" fill="#8a8a93" font-size="9">Logs</text>
  <text x="34" y="156" fill="#8a8a93" font-size="9">Sessions</text>
  <text x="34" y="178" fill="#8a8a93" font-size="9">Domains</text>
  <text x="34" y="206" fill="#8a8a93" font-size="9">Billing</text>
  <circle cx="24" cy="109" r="2.2" fill="#6b6b73"/>
  <circle cx="24" cy="131" r="2.2" fill="#6b6b73"/>
  <circle cx="24" cy="153" r="2.2" fill="#6b6b73"/>
  <circle cx="24" cy="175" r="2.2" fill="#6b6b73"/>
  <circle cx="24" cy="203" r="2.2" fill="#6b6b73"/>

  <!-- weekly calls mini -->
  <text x="16" y="404" fill="#8a8a93" font-size="7.5">Weekly calls</text>
  <rect x="16" y="410" width="100" height="4" rx="2" fill="#23232b"/>
  <rect x="16" y="410" width="42" height="4" rx="2" fill="url(#castBar)"/>

  <!-- ===== Main content ===== -->
  <!-- Total Requests panel -->
  <rect x="148" y="18" width="516" height="196" rx="10" fill="#101013" stroke="#1d1d24" stroke-width="1"/>
  <text x="166" y="40" fill="#7a7a83" font-size="8" font-weight="600">⌁ Total Requests · Last 30 days</text>
  <text x="166" y="64" fill="#f4f4f6" font-size="22" font-weight="800">15.0K</text>
  <text x="230" y="62" fill="#34d399" font-size="9" font-weight="700">↗ +28%</text>
  <text x="166" y="78" fill="#6b6b73" font-size="7.5">383 errors · 2.5% error rate · 163 ms avg latency</text>

  <!-- time toggle -->
  <rect x="596" y="32" width="54" height="16" rx="5" fill="#1a1a20"/>
  <rect x="632" y="34" width="16" height="12" rx="4" fill="#2b2b34"/>
  <text x="602" y="43" fill="#7a7a83" font-size="7">1d</text>
  <text x="615" y="43" fill="#7a7a83" font-size="7">1w</text>
  <text x="636" y="43" fill="#e7e7ea" font-size="7">1m</text>

  <!-- area chart -->
  <path d="M 166 150 C 190 92, 210 96, 232 150 C 250 188, 268 110, 290 116 C 312 122, 330 150, 352 122 C 374 96, 392 150, 414 152 C 436 154, 454 120, 476 126 C 498 132, 516 150, 538 138 C 560 128, 580 132, 602 140 L 640 146 L 640 188 L 166 188 Z" fill="url(#castArea)"/>
  <path d="M 166 150 C 190 92, 210 96, 232 150 C 250 188, 268 110, 290 116 C 312 122, 330 150, 352 122 C 374 96, 392 150, 414 152 C 436 154, 454 120, 476 126 C 498 132, 516 150, 538 138 C 560 128, 580 132, 602 140 L 640 146" fill="none" stroke="#7c7cf0" stroke-width="2.2"/>
  <!-- latency line -->
  <path d="M 166 110 C 196 104, 214 138, 240 130 C 268 122, 286 100, 314 108 C 344 116, 360 132, 392 118 C 422 106, 444 120, 476 112 C 508 104, 528 116, 560 108 C 590 100, 612 110, 640 106" fill="none" stroke="#f0a93b" stroke-width="1.8"/>
  <!-- errors dashed -->
  <path d="M 166 178 C 220 176, 280 180, 340 177 C 400 174, 470 179, 540 177 C 590 176, 615 178, 640 177" fill="none" stroke="#ef5350" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- x axis labels -->
  <text x="166" y="202" fill="#5a5a63" font-size="6.5">May 29</text>
  <text x="320" y="202" fill="#5a5a63" font-size="6.5">Jun 10</text>
  <text x="470" y="202" fill="#5a5a63" font-size="6.5">Jun 16</text>
  <text x="616" y="202" fill="#5a5a63" font-size="6.5">Jun 27</text>

  <!-- ===== Top Tools panel ===== -->
  <rect x="148" y="226" width="320" height="196" rx="10" fill="#101013" stroke="#1d1d24" stroke-width="1"/>
  <text x="166" y="248" fill="#f4f4f6" font-size="11" font-weight="700">Top Tools</text>
  <text x="166" y="260" fill="#6b6b73" font-size="7">Last 30 days</text>
  <rect x="392" y="240" width="60" height="15" rx="5" fill="#1a1a20"/>
  <text x="400" y="250" fill="#e7e7ea" font-size="7">Requests</text>

  <!-- tool rows -->
  <g font-size="8">
    <text x="166" y="282" fill="#cfcfd6" font-family="monospace">get_customer</text>
    <text x="436" y="282" fill="#e7e7ea" text-anchor="end" font-weight="700">4.8K</text>
    <rect x="166" y="287" width="286" height="4" rx="2" fill="#1c1c22"/>
    <rect x="166" y="287" width="286" height="4" rx="2" fill="url(#castBar)"/>

    <text x="166" y="308" fill="#cfcfd6" font-family="monospace">list_orders</text>
    <text x="436" y="308" fill="#e7e7ea" text-anchor="end" font-weight="700">3.5K</text>
    <rect x="166" y="313" width="286" height="4" rx="2" fill="#1c1c22"/>
    <rect x="166" y="313" width="210" height="4" rx="2" fill="url(#castBar)"/>

    <text x="166" y="334" fill="#cfcfd6" font-family="monospace">create_payment_intent</text>
    <text x="436" y="334" fill="#e7e7ea" text-anchor="end" font-weight="700">2.9K</text>
    <rect x="166" y="339" width="286" height="4" rx="2" fill="#1c1c22"/>
    <rect x="166" y="339" width="174" height="4" rx="2" fill="url(#castBar)"/>

    <text x="166" y="360" fill="#cfcfd6" font-family="monospace">update_inventory</text>
    <text x="436" y="360" fill="#e7e7ea" text-anchor="end" font-weight="700">1.8K</text>
    <rect x="166" y="365" width="286" height="4" rx="2" fill="#1c1c22"/>
    <rect x="166" y="365" width="110" height="4" rx="2" fill="url(#castBar)"/>

    <text x="166" y="386" fill="#cfcfd6" font-family="monospace">send_notification</text>
    <text x="436" y="386" fill="#e7e7ea" text-anchor="end" font-weight="700">1.2K</text>
    <rect x="166" y="391" width="286" height="4" rx="2" fill="#1c1c22"/>
    <rect x="166" y="391" width="74" height="4" rx="2" fill="url(#castBar)"/>

    <text x="166" y="412" fill="#cfcfd6" font-family="monospace">get_analytics</text>
    <text x="436" y="412" fill="#e7e7ea" text-anchor="end" font-weight="700">892</text>
    <rect x="166" y="417" width="286" height="4" rx="2" fill="#1c1c22"/>
    <rect x="166" y="417" width="54" height="4" rx="2" fill="url(#castBar)"/>
  </g>

  <!-- ===== MCP Servers panel ===== -->
  <rect x="478" y="226" width="186" height="196" rx="10" fill="#101013" stroke="#1d1d24" stroke-width="1"/>
  <text x="496" y="248" fill="#f4f4f6" font-size="11" font-weight="700">MCP Servers</text>
  <text x="496" y="260" fill="#6b6b73" font-size="7">5 active · this month</text>

  <!-- stacked bar -->
  <rect x="496" y="270" width="150" height="6" rx="3" fill="#1c1c22"/>
  <rect x="496" y="270" width="74" height="6" rx="3" fill="#3b82f6"/>
  <rect x="570" y="270" width="51" height="6" fill="#8b5cf6"/>
  <rect x="621" y="270" width="12" height="6" fill="#22d3a6"/>
  <rect x="633" y="270" width="9" height="6" fill="#34d399"/>
  <rect x="642" y="270" width="4" height="6" rx="3" fill="#f0a93b"/>

  <g font-size="8.5">
    <circle cx="500" cy="295" r="3" fill="#3b82f6"/>
    <text x="510" y="298" fill="#cfcfd6">Stripe API</text>
    <text x="646" y="298" fill="#e7e7ea" text-anchor="end" font-weight="700">7.7K</text>

    <circle cx="500" cy="318" r="3" fill="#8b5cf6"/>
    <text x="510" y="321" fill="#cfcfd6">Shopify</text>
    <text x="646" y="321" fill="#e7e7ea" text-anchor="end" font-weight="700">5.4K</text>

    <circle cx="500" cy="341" r="3" fill="#22d3a6"/>
    <text x="510" y="344" fill="#cfcfd6">Ops Tools</text>
    <text x="646" y="344" fill="#e7e7ea" text-anchor="end" font-weight="700">1.2K</text>

    <circle cx="500" cy="364" r="3" fill="#34d399"/>
    <text x="510" y="367" fill="#cfcfd6">Internal</text>
    <text x="646" y="367" fill="#e7e7ea" text-anchor="end" font-weight="700">892</text>

    <circle cx="500" cy="387" r="3" fill="#f0a93b"/>
    <text x="510" y="390" fill="#cfcfd6">CRM Sync</text>
    <text x="646" y="390" fill="#e7e7ea" text-anchor="end" font-weight="700">541</text>
  </g>
  <text x="496" y="412" fill="#5a5a63" font-size="6.5">Top 3 servers account for 84% of calls</text>
</svg>
